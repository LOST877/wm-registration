name: Deploy to Timeweb

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Деплой через rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.htaccess' \
            --exclude='.htaccess.example' \
            --exclude='hash.php' \
            --exclude='CLAUDE.md' \
            --exclude='PROJECT_KNOLEDGE.md' \
            --exclude='sql/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/wm-registration/public_html/
