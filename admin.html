<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Wheel Masters</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <header>
    <h1>Админ-панель</h1>
  </header>

  <main>
    <!-- Форма авторизации -->
    <section id="auth-section" class="auth-section">
      <div class="auth-box">
        <h2>Вход</h2>
        <form id="login-form">
          <input type="text" id="username" name="username" placeholder="Логин" required>
          <input type="password" id="password" name="password" placeholder="Пароль" required>
          <button type="submit">Вход</button>
        </form>
        <div id="auth-error" class="auth-error"></div>
      </div>
    </section>

    <!-- Дашборд (скрыт по умолчанию) -->
    <section id="dashboard-section" class="dashboard-section" style="display: none;">
      <div id="races-container"></div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>

</html>
